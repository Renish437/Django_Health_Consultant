   <div class="col-md-4 col-sm-4 col-xs-12">
                            <div class="single-product-item">
                                <div  class="img-holder">
                                    <img src="{{product.image.url}}" alt="{{product.product_name}}">
                                    <div class="overlay-style-one">
                                        <div class="box">
                                            <div class="content">
                                                <a class="thm-btn bgclr-1" href="#">Add to Cart</a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="title-holder">
                                    <div class="top clearfix">
                                        <a href="{{product.get_detail_url }}" class="product-title pull-left">
                                            <h5>{{product.product_name}}</h5>
                                        </a>
                                        <div class="review-box pull-right">
                                            <ul>
                                          
    {% for i in "12345" %}
        {% if forloop.counter <= product.rating %}
            <li><i class="fa fa-star text-yellow-400"></i></li>  {# filled star #}
        {% else %}
            <li><i class="fa fa-star-o text-gray-400"></i></li>  {# empty star #}
        {% endif %}
    {% endfor %}


                                            </ul>
                                        </div>    
                                    </div>
                                    <div class="product-value">
                                        <h4>${{product.price}}</h4>
                                    </div>
                                </div>
                            </div>
                        </div>
